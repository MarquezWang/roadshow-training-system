name: CI

on:
  push:
    branches:
      - internal-test
  pull_request:
    branches:
      - internal-test

jobs:
  checks:
    name: Lint, build, and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Auth boundary tests
        run: npm run test:auth

      - name: Production auth guard tests
        run: npm run test:prod-guard

      - name: Stability tests
        env:
          AUTH_ENABLED: "false"
          DYNAMIC_FOLLOWUP_EXPERIMENT: "true"
          DATABASE_URL: file:./data/ci-stability-test.db
          STABILITY_TEST_DATABASE_URL: file:./data/ci-stability-test.db
          STABILITY_TEST_BASE_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          mkdir -p data
          rm -f data/ci-stability-test.db data/ci-stability-test.db-journal
          npx prisma db push --skip-generate
          npm run dev > /tmp/roadshow-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..60}; do
            if curl -fsS "$STABILITY_TEST_BASE_URL" >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/roadshow-next.log
              exit 1
            fi
            sleep 2
          done
          curl -fsS "$STABILITY_TEST_BASE_URL" >/dev/null || {
            cat /tmp/roadshow-next.log
            exit 1
          }
          npm run test:stability

      - name: TRL tests
        run: npm run test:trl
