name: CI

on:
  push:
    branches:
      - internal-test
  pull_request:
    branches:
      - internal-test

jobs:
  checks:
    name: Lint, build, and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Stability tests
        run: npm run test:stability

      - name: TRL tests
        run: npm run test:trl
