name: CI

on:
  push:
    branches:
      - internal-test
  pull_request:
    branches:
      - internal-test

jobs:
  checks:
    name: Lint, build, and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Auth boundary tests
        run: npm run test:auth

      - name: Production auth guard tests
        run: npm run test:prod-guard

      - name: File security and lifecycle tests
        run: npm run test:files

      - name: Deterministic scoring tests
        run: npm run test:scoring-v2

      - name: Stability tests
        env:
          STABILITY_TEST_DATABASE_URL: file:./ci-stability-test.db
          STABILITY_TEST_PORT: "3000"
        run: npm run test:stability:local

      - name: TRL tests
        run: npm run test:trl
